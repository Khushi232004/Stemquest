<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - StemQuest</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-4" style="max-width:420px">
  <h3 class="mb-3" data-i18n="login">Login</h3>
  <div id="msg"></div>
  <form method="post" action="/login">
    <input id="uname" class="form-control mb-2" name="username" required data-i18n-ph="studentCode" placeholder="Login code">
    <input class="form-control mb-3" type="password" name="password" required data-i18n-ph="password" placeholder="Password">
    <button class="btn btn-primary w-100" type="submit" data-i18n="login">Login</button>
  </form>
  <p class="mt-3"><span data-i18n="noAccount">No account?</span> <a href="/register.html" data-i18n="register">Register</a></p>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  await loadLang(); renderNav(false);
  const p = new URLSearchParams(location.search);
  const msg = document.getElementById('msg');
  if (p.get('error')) { msg.className = 'alert alert-danger'; msg.textContent = t('loginError'); }
  const code = p.get('code');
  if (code) {
    msg.className = 'alert alert-success';
    msg.textContent = t('yourCode') + ': ' + code + '. ' + t('writeItDown');
    document.getElementById('uname').value = code;
  }
})();
</script>
</body>
</html>
