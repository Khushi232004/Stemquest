<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student - StemQuest</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-4" style="max-width:800px">
  <a href="/students.html" class="small" data-i18n="backToList">Back to students</a>
  <div id="main" class="mt-3">
    <div class="card hero mb-3">
      <div class="mascot">🧑‍🎓</div>
      <div>
        <h4 id="sname" class="mb-1"></h4>
        <span id="srank" class="rank"></span>
        <div class="text-muted small mt-2"><span data-i18n="code">Code</span>: <strong id="scode"></strong></div>
      </div>
    </div>
    <div class="row g-3 text-center mb-3">
      <div class="col-3"><div class="stat"><div id="streak" class="stat-val"></div><div class="stat-lbl" data-i18n="streak">streak</div></div></div>
      <div class="col-3"><div class="stat"><div id="xp" class="stat-val"></div><div class="stat-lbl">XP</div></div></div>
      <div class="col-3"><div class="stat"><div id="games" class="stat-val"></div><div class="stat-lbl" data-i18n="games">Games</div></div></div>
      <div class="col-3"><div class="stat"><div id="avg" class="stat-val"></div><div class="stat-lbl" data-i18n="avgScore">Avg %</div></div></div>
    </div>

    <h5 class="sec"><span data-i18n="recent">Recent activity</span></h5>
    <div id="hist" class="lbbox"></div>

    <div class="d-flex gap-2 flex-wrap mt-4">
      <button id="reset" class="btn btn-primary" data-i18n="resetPw">Reset password</button>
      <button id="del" class="btn btn-danger" data-i18n="removeStudent">Remove student</button>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  await loadLang(); renderNav(true);
  const $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get('id');
  const s = await getJSON('/api/teacher/students/' + id, 'st_' + id);
  if (!s) { $('main').textContent = t('teacherOnly'); return; }

  $('sname').textContent = s.name;
  $('srank').textContent = (s.grade ? t('grade' + s.grade) + ' · ' : '') + t('level') + ' ' + s.level + ' · ' + rankFor(s.level);
  $('scode').textContent = s.code + (s.className && s.className !== '-' ? ' · ' + s.className : '');
  $('streak').textContent = '🔥 ' + s.streak;
  $('xp').textContent = '⚡ ' + s.xp;
  $('games').textContent = s.games;
  $('avg').textContent = s.avg + '%';

  if (!s.history.length) $('hist').append(mk('div', 'lbrow text-muted', t('noHistory')));
  s.history.forEach(h => {
    const row = mk('div', 'lbrow');
    row.append(mk('div', 'rk', h.game === 'MATCH' ? '🧩' : '❓'),
               mk('div', 'nm', tr('topic_' + h.topic, h.topic)),
               mk('span', 'text-muted small me-2', String(h.playedAt).slice(0, 10)),
               mk('strong', '', h.score + '/' + h.total));
    $('hist').append(row);
  });

  $('reset').onclick = async () => {
    const pw = prompt(t('newPw'));
    if (!pw) return;
    try {
      const r = await fetch('/api/teacher/students/' + id + '/password', { method: 'POST',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
      if (r.ok) alert(t('pwChanged'));
      else { const d = await r.json().catch(() => ({})); alert(d.message || 'Error'); }
    } catch (e) { alert(t('needOnline')); }
  };

  $('del').onclick = async () => {
    if (!confirm(t('confirmDelete'))) return;
    try {
      const r = await fetch('/api/teacher/students/' + id, { method: 'DELETE' });
      if (r.ok) { alert(t('removed')); location.href = '/students.html'; }
      else alert('Error');
    } catch (e) { alert(t('needOnline')); }
  };
})();
</script>
</body>
</html>
