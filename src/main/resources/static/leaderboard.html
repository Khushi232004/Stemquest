<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranks - StemQuest</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-4" style="max-width:700px">
  <h3 class="mb-3">🏆 <span data-i18n="ranksTitle">Top learners</span></h3>
  <div id="lb" class="lbbox"></div>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  await loadLang(); renderNav(true);
  const me = await getJSON('/api/users/me', 'me');
  const lbGrade = me && me.role === 'STUDENT' ? (me.grade || 6) : 'all';
  const lb = await getJSON('/api/leaderboard' + (lbGrade === 'all' ? '' : '?grade=' + lbGrade), 'lb_students_v10_' + lbGrade) || [];
  const medals = ['🥇', '🥈', '🥉'];
  lb.forEach((u, i) => {
    const row = mk('div', 'lbrow' + (me && u.id === me.id ? ' me' : ''));
    row.append(mk('div', 'rk', i < 3 ? medals[i] : String(i + 1)), mk('div', 'nm', u.name), mk('strong', '', u.xp + ' XP'));
    document.getElementById('lb').append(row);
  });
})();
</script>
</body>
</html>
