<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz - StemQuest</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-4" style="max-width:700px">
  <div id="box" class="card p-4">
    <div class="progress mb-3"><div id="qbar" class="progress-bar" style="width:0%"></div></div>
    <div class="d-flex justify-content-between mb-2">
      <span id="count" class="badge bg-secondary"></span>
      <span id="timer" class="badge bg-danger"></span>
    </div>
    <h5 id="qtext" class="mb-3"></h5>
    <div id="opts" class="d-grid gap-2"></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/quiz.js"></script>
</body>
</html>
